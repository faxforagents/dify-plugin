name: ci

# Provenance: faxforagents/mcp .github/workflows/ci.yml (2026-10-31), actions pinned by SHA.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  truthcheck:
    name: truth pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/truthcheck.sh

  test:
    name: the tools against a fake API on python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:warnings

  package:
    name: the .difypkg builds with the Dify plugin CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch dify-plugin 0.6.13 (checksum pinned)
        run: |
          curl -sSL -o dify-plugin https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.13/dify-plugin-linux-amd64
          echo "9e767eea4c378932969fca83673d7883912fb4654dfd52ec9fd3d902c80d849e  dify-plugin" | sha256sum -c -
          chmod +x dify-plugin
      - name: Package
        run: |
          VERSION=$(sed -n 's/^version: //p' manifest.yaml | head -1)
          ./dify-plugin plugin package . -o "faxforagents-${VERSION}.difypkg"
          unzip -l "faxforagents-${VERSION}.difypkg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: difypkg
          path: "*.difypkg"
